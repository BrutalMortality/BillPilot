J<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillPilot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #121212;
      color: white;
      padding: 24px;
    }

    .card {
      background: #1f1f1f;
      border-radius: 16px;
      padding: 24px;
      margin-top: 30px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      color: #cfcfcf;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Welcome to BillPilot</h1>

  <p>
    I'm going to help you build your monthly bill plan.<br><br>
    Just answer a few questions and I'll do the planning.
  </p>

  <button onclick="startSetup()">Continue</button>

</div>
<script>
function startSetup() {
  document.querySelector(".card").innerHTML = `
    <h1>Where does your paycheck go?</h1>

    <p>
      Let's start by adding the account where your paycheck is deposited.
    </p>

    <button onclick="showAccountForm()">Add Account</button>
  `;
}
function showAccountForm() {
  document.querySelector(".card").innerHTML = `
    <h1>Add Account</h1>

    <p>What should BillPilot call this account?</p>

    <input
      type="text"
      id="accountName"
      placeholder="Example: Main Checking"
      style="width:100%;padding:16px;margin-bottom:16px;border:none;border-radius:12px;font-size:18px;"
    >

    <button onclick="saveAccount()">Save Account</button>
  `;
}
function saveAccount() {
  const accountName = document.getElementById("accountName").value.trim();

  if (!accountName) {
    alert("Please enter an account name.");
    return;
  }

  localStorage.setItem("billpilotAccount", accountName);

  document.querySelector(".card").innerHTML = `
    <h1>Do you have another account?</h1>

    <p>${accountName} has been saved.</p>

    <button onclick="showAccountForm()">Add Another Account</button>

    <button
      onclick="continueToBills()"
      style="margin-top:12px;background:#333;"
    >
      No, Continue
    </button>
  `;
}
function continueToBills() {
  document.querySelector(".card").innerHTML = `
    <h1>Let's add your bills</h1>

    <p>
      Add every bill you pay during the month.
    </p>

    <button onclick="showBillForm()">Add Bill</button>
  `;
}
</script>
</body>
</html>
