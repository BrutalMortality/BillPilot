<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillPilot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #121212;
      color: white;
      padding: 24px;
    }

    .card {
      background: #1f1f1f;
      border-radius: 16px;
      padding: 24px;
      margin-top: 30px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      color: #cfcfcf;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Welcome to BillPilot</h1>

  <p>
    I'm going to help you build your monthly bill plan.<br><br>
    Just answer a few questions and I'll do the planning.
  </p>

  <button>Continue</button>

</div>

</body>
</html>
